[workspace]
members = ["crates/nesasm-core", "crates/nesasm-cli", "crates/nesasm-mcp"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
# let-chains in `if let ... && let ...`.
rust-version = "1.88"
license = "MIT"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
dbg_macro = "warn"
todo = "warn"

[workspace.dependencies]
nesasm-core = { path = "crates/nesasm-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
schemars = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "io-std", "io-util", "sync", "time"] }
rmcp = { version = "3", features = ["server", "transport-io"] }
