name: Rust build, test and compatibility
on:
  push:
    branches: [develop/2.x, rustdev]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# Actions are pinned to commit SHAs (tag in the comment). The Rust toolchain
# and its components come from rust-toolchain.toml.
jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - run: cargo fmt --all -- --check
  rust:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, ubuntu-24.04, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # Clippy runs on every OS because some code is platform specific.
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      # Includes the golden C# compatibility cases (tools/compat/golden.json)
      # and, on Windows, the junction escape test.
      - run: cargo test --workspace --locked
      - run: cargo build --workspace --release --locked
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nesasm-${{ matrix.os }}
          path: |
            target/release/nesasm
            target/release/nesasm.exe
            target/release/nesasm-mcp
            target/release/nesasm-mcp.exe
          if-no-files-found: error
  compatibility:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '8.0.x'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
      - run: dotnet build tools/compat/Oracle.csproj --configuration Release
      - run: cargo build --workspace --locked
      - run: python tools/compat/compare.py --oracle tools/compat/bin/Release/net48/NesAsmOracle.exe --rust target/debug/nesasm.exe --write-golden target/compat/golden.json
      - name: Recorded golden results are current
        run: python tools/compat/check_golden.py tools/compat/golden.json target/compat/golden.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: compatibility-results
          path: target/compat/cases
